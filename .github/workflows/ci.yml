name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The job id "ci" is the required status check on main (see mgpl-diagnostics/.github scripts/protect-repos.mjs).
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # @mgpl-diagnostics/db-kit comes from GitHub Packages
      - uses: mgpl-diagnostics/.github/actions/node@claude/project-thread-dsh6g4
        with:
          github-packages: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          mongodb: "true"
      - run: npm run typecheck
      - name: Tests (GST, receivables, settlements, cash, bank, lock dates, year end, golden CSVs) on MongoDB and PostgreSQL
        run: npm test
      - run: npm run build
      - name: llms-full.txt is up to date (run `npm run llms` and commit if this fails)
        run: npm run llms && git diff --exit-code -- llms-full.txt
